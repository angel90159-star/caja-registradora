<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Yastás Auto-Descarga</title>
  <style>
    body { font-family: system-ui, sans-serif; width: 280px; padding: 12px; }
    h1 { font-size: 14px; margin: 0 0 10px; }
    #estado { font-size: 12px; color: #555; margin-bottom: 10px; line-height: 1.4; }
    label { font-size: 11px; color: #777; display: block; margin-bottom: 2px; }
    input, button { width: 100%; box-sizing: border-box; padding: 6px; margin-bottom: 8px; font-size: 13px; }
    button { cursor: pointer; }
    details { margin-top: 12px; border-top: 1px solid #ddd; padding-top: 8px; }
    summary { font-size: 12px; cursor: pointer; color: #444; margin-bottom: 8px; }
    #cred-estado { font-size: 11px; color: #2a7; margin-bottom: 6px; }
    .aviso { font-size: 10px; color: #a66; line-height: 1.3; margin-bottom: 8px; }
    .fila { display: flex; gap: 6px; }
    .fila button { margin-bottom: 0; }
  </style>
</head>
<body>
  <h1>Yastás Auto-Descarga</h1>
  <div id="estado">Sin trabajos pendientes</div>

  <label for="fecha">Fecha a descargar (prueba manual)</label>
  <input id="fecha" type="date" />
  <button id="probar">Probar descarga</button>

  <details id="cred-panel">
    <summary>Credenciales del portal</summary>
    <div class="aviso">
      Se guardan solo en este navegador (sin cifrar). Úsalo únicamente en una
      máquina de prueba o de confianza. Nunca se envían a ningún lado.
    </div>
    <div id="cred-estado"></div>
    <label for="usuario">Usuario</label>
    <input id="usuario" type="text" autocomplete="off" />
    <label for="password">Contraseña</label>
    <input id="password" type="password" autocomplete="off" />
    <div class="fila">
      <button id="guardar-cred">Guardar</button>
      <button id="borrar-cred">Borrar</button>
    </div>
  </details>
</body>
<script src="popup.js"></script>
</html>
